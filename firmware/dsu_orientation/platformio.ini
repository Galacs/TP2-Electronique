; Projet PlatformIO autonome : variante "sortie rapide" pour le pont DSU.
;
;   cd firmware/dsu_orientation
;   pio run -t upload
;
; Le sketch du TP (src/main.cpp a la racine) n'est pas touche : pour le
; reflasher, revenir a la racine et faire "pio run -t upload".
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
